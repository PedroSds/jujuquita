<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7f0"><title>Jujuquita | Administração</title><link rel="stylesheet" href="../admin.css"></head>
<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-overview" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/></symbol>
    <symbol id="icon-products" viewBox="0 0 24 24"><path d="M5 7h14l1.5 14h-17L5 7Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></symbol>
    <symbol id="icon-categories" viewBox="0 0 24 24"><path d="M3 5h6l2 2h10v12H3Z"/><path d="M3 10h18"/></symbol>
    <symbol id="icon-highlights" viewBox="0 0 24 24"><path d="m12 3 2.7 5.8 6.3.9-4.5 4.5 1 6.3-5.5-3-5.5 3 1-6.3L3 9.7l6.3-.9L12 3Z"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2" fill="white"/><circle cx="16" cy="12" r="2" fill="white"/><circle cx="10" cy="18" r="2" fill="white"/></symbol>
    <symbol id="icon-security" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></symbol>
    <symbol id="icon-orders" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6m-6 4h6m-6 4h4"/></symbol>
    <symbol id="icon-store" viewBox="0 0 24 24"><path d="M3 9l2-5h14l2 5v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0Zm2 5v6h14v-6m-9 6v-5h4v5"/></symbol>
    <symbol id="icon-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
  </svg>
  <form id="admin-login" class="panel form-panel">
    <div class="login-brand"><span class="brand-art" role="img" aria-label="Jujuquita"></span></div>
    <div><h1>Acesso à loja</h1><p>Entre para administrar a Jujuquita.</p></div>
    <label>Senha<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn">Entrar</button><p role="status" id="login-status"></p>
  </form>
  <aside class="sidebar" hidden>
    <div class="brand"><span class="brand-art" role="img" aria-label="Jujuquita"></span><small>Painel da loja</small></div>
    <nav aria-label="Menu administrativo">
      <button data-tab="overview">Visão geral</button>
      <span class="nav-label">CATÁLOGO</span>
      <button data-tab="products">Produtos</button>
      <button data-tab="categories">Categorias</button>
      <button data-tab="highlights">Destaques</button>
      <span class="nav-label">LOJA</span>
      <button data-tab="settings">Configurações</button>
      <button data-tab="orders">Pedidos</button>
      <button data-tab="security">Senha do painel</button>
    </nav>
    <div class="sidebar-footer"><button class="outline" id="logout">Sair</button></div>
  </aside>
  <div class="workspace" hidden>
    <header class="topbar">
      <span class="breadcrumb">Minha loja <span class="crumb" aria-hidden="true">/</span> <strong id="location"></strong></span>
      <span class="brand-art mobile-brand" role="img" aria-label="Jujuquita"></span>
      <a class="outline visit-store" href="../index.html" target="_blank" rel="noopener"><svg class="icon" aria-hidden="true"><use href="#icon-store"></use></svg> Ver vitrine</a>
    </header>
    <main>
      <div class="page-heading"><div><h1 id="title" tabindex="-1"></h1><p id="description"></p></div><button class="btn" id="create" hidden></button></div>
      <p id="status" role="status"></p>
      <div id="overview"></div>
      <section class="panel" id="list" hidden>
        <div class="toolbar catalog-filters"><input id="filter" type="search" aria-label="Buscar por nome" placeholder="Buscar por nome"><select id="category-filter" aria-label="Filtrar por categoria" hidden></select><select id="publication" aria-label="Filtrar por status"><option value="">Todos os status</option><option value="active">Publicados</option><option value="draft">Rascunhos</option></select></div>
        <p class="record-count" id="record-count" aria-live="polite"></p>
        <div id="records"></div>
      </section>
      <form class="panel form-panel" id="settings" hidden><h2>WhatsApp para pedidos</h2><p>O cliente vai abrir uma conversa neste número com o pedido preenchido.</p><label>WhatsApp com DDI e DDD<input name="whatsapp" type="tel" placeholder="55 + DDD + número"></label><button class="btn">Salvar WhatsApp</button></form>
      <dialog id="editor-dialog"><form id="editor"></form></dialog>
    </main>
    <nav class="mobile-nav" aria-label="Menu administrativo no celular">
      <button data-tab="overview">Início</button>
      <button data-tab="products">Produtos</button>
      <button data-tab="categories">Categorias</button>
      <details id="mobile-menu">
        <summary><svg class="icon" aria-hidden="true"><use href="#icon-more"></use></svg>Mais</summary>
        <div class="mobile-menu-panel">
          <button data-tab="highlights">Destaques</button>
          <button data-tab="orders">Pedidos</button>
          <button data-tab="settings">Configurações</button>
          <button data-tab="security">Senha do painel</button>
          <button data-logout>Sair do painel</button>
        </div>
      </details>
    </nav>
  </div>
  <script src="../catalog.js"></script><script src="../database.js"></script><script src="../bootstrap.js"></script>
</body></html>
